<div class="h-dvh overflow-hidden bg-surface flex flex-col md:block md:h-auto md:overflow-visible md:min-h-screen">
  <!-- Skip link (target: #main-content). Native fragment focus — #main-content
       has tabindex="-1" so the browser moves focus there on activation; no JS. -->
  <a href="#main-content"
     class="sr-only focus:not-sr-only focus:fixed focus:z-[100] focus:top-4 focus:left-4 focus:px-4 focus:py-2 focus:bg-primary focus:text-white focus:rounded-lg focus:text-sm focus:font-semibold focus:shadow-lg">
    Skip to main content
  </a>

  <!-- Overlay (mobile sidebar) -->
  @if (showOverlay()) {
    <div class="fixed inset-0 bg-black/20 z-40 md:hidden" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar (desktop only — hidden on mobile now) -->
  <app-sidebar [isOpen]="isSidebarOpen()" [isMobile]="isMobile()" (closeSidebar)="closeSidebar()"></app-sidebar>

  <!-- Shared mobile top bar — page title + theme toggle + profile avatar -->
  <header
    class="md:hidden flex items-center justify-between gap-2 px-4 h-14 border-b border-border bg-surface-raised shrink-0"
    aria-label="Barra superiore">
    <span class="font-display font-bold text-text tracking-tight truncate">{{ mobileTitle() || 'ITAL-IA' }}</span>
    <div class="flex items-center gap-1 -mr-1">
      <button type="button" (click)="themeService.toggleTheme()"
        class="p-2 rounded-md text-text-secondary hover:text-text hover:bg-surface-inset transition-colors motion-reduce:transition-none min-h-11 min-w-11 flex items-center justify-center"
        [attr.aria-label]="themeService.isDark() ? 'Passa alla modalità chiara' : 'Passa alla modalità scura'"
        [attr.aria-pressed]="themeService.isDark()">
        @if (themeService.isDark()) {
        <svg lucideSun class="w-5 h-5" aria-hidden="true"></svg>
        } @else {
        <svg lucideMoon class="w-5 h-5" aria-hidden="true"></svg>
        }
      </button>
      <a routerLink="/profile"
        class="ml-1 w-9 h-9 rounded-full bg-primary text-white text-xs font-bold flex items-center justify-center hover:bg-primary-hover transition-colors"
        aria-label="Profilo">
        {{ userInitials() }}
      </a>
    </div>
  </header>

  <!-- Main content -->
  <main #mainContent id="main-content" tabindex="-1" [attr.aria-label]="currentPageTitle()" class="md:pl-64 flex-1 md:h-dvh flex flex-col min-h-0 overscroll-contain focus:outline-none focus-visible:outline-none">
    <router-outlet></router-outlet>
  </main>

  <!-- Screen reader route announcer -->
  <div class="sr-only" aria-live="polite" aria-atomic="true">
    {{ routeAnnouncement() }}
  </div>

  <!-- Toast notifications -->
  <app-toast />

  <!-- Bottom tab bar (mobile only) -->
  <app-bottom-tab-bar class="sticky bottom-0 z-30" />
</div>
